name: setting-default-labels

on:
   schedule:
      - cron: '0 0/3 * * *'

jobs:
   label-issues:
      runs-on: ubuntu-latest
      permissions:
         issues: write
         pull-requests: write
      steps:
         - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
           name: Mark idle issues and PRs and close inactive ones
           with:
              repo-token: ${{ secrets.GITHUB_TOKEN }}
              stale-issue-message: 'This issue is idle after 60 days with no activity. It will be closed in 14 days if there is no further activity.'
              stale-issue-label: 'idle'
              close-issue-message: 'Closing this issue after 14 more days with no activity since it was marked idle.'
              stale-pr-message: 'This PR is idle after 60 days with no activity. It will be closed in 14 days if there is no further activity.'
              stale-pr-label: 'idle'
              close-pr-message: 'Closing this PR after 14 more days with no activity since it was marked idle.'
              days-before-stale: 60
              days-before-close: 14
              remove-stale-when-updated: true
              operations-per-run: 100
              exempt-issue-labels: 'backlog'
